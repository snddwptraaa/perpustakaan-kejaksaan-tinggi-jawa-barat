name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: iconv, pdo_mysql, pdo_sqlite, zip
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: composer audit --locked
      - run: composer check-platform-reqs --no-dev
      - run: composer install --dry-run --no-dev --classmap-authoritative --no-interaction
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: php artisan test

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: perpustakaan_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: perpustakaan_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: iconv, pdo_mysql, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate:fresh --force
      - name: Verify production configuration and infrastructure
        run: php artisan production:check
        env:
          APP_ENV: production
          APP_DEBUG: false
          APP_URL: https://perpustakaan.example.go.id
          APP_LOCALE: id
          APP_TIMEZONE: Asia/Jakarta
          SESSION_ENCRYPT: true
          SESSION_SECURE_COOKIE: true
          MAIL_MAILER: smtp
          MAIL_HOST: smtp.example.test
          MAIL_FROM_ADDRESS: perpustakaan@example.test
          LOG_LEVEL: warning
          VISITOR_RETENTION_DAYS: 365
          SEED_DEMO_DATA: false
      - name: Run test suite against MySQL
        run: php artisan test
        env:
          APP_ENV: testing

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: iconv, pdo_mysql, pdo_sqlite, zip
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Prepare test environment
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          php artisan key:generate
      - run: composer check-platform-reqs --no-dev
      - run: npm run build
      - run: php artisan test --compact
